name: Install brand asset

on:
  push:
    paths:
      - '.github/workflows/install-brand.yml'

permissions:
  contents: write

jobs:
  install-brand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v1-prep
      - name: Install local Home Assistant brand icon
        shell: bash
        run: |
          mkdir -p custom_components/jojo_tank/brand
          cat > /tmp/icon.b64 <<'EOF'

EOF
          base64 --decode /tmp/icon.b64 > custom_components/jojo_tank/brand/icon.png
          file custom_components/jojo_tank/brand/icon.png
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add custom_components/jojo_tank/brand/icon.png
          git rm .github/workflows/install-brand.yml
          git commit -m 'Add local Home Assistant brand icon'
          git push origin HEAD:release/v1-prep
